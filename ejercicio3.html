<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de productos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <a class="boton-regresar" href="index.html">Volver al inicio</a>
    <h1>Inventario de productos</h1>

    <form id="formulario" novalidate>
        <label for="producto">Nombre del producto</label>
        <input type="text" id="producto" required>
        <label for="precio">Precio Unitario</label>
        <input type="number" id="precio" min="0" step="any" required>
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" min="1" step="1" required>

        <button type="submit" id="btnAgregar">Agregar producto</button>
    </form>

    <h2>Productos registrados</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio Unitario</th>
                <th>Cantidad</th>
                <th>Subtotal</th>

            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
    <h2>Resultados</h2>
    <p id="total"></p>
    <script src="js/ejercicio3.js"></script>
</body>
</html>
