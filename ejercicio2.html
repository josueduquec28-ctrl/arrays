<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de números</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <a class="boton-regresar" href="index.html">Volver al inicio</a>
    <h1>Operaciones con Arrays</h1>

    <form id="formulario">
        <input type="number" id="numero" placeholder="Ingrese un numero" step="any">
        <button type="submit" id="btnAgregar">Agregar un número</button>
    </form>
    <h2>Números registrados</h2>
    <ul id="lista"></ul>

    <h2>Resultados</h2>
    <p id="suma"></p>
    <p id="promedio"></p>
    <p id="mayor"></p>
    <p id="menor"></p>
    <script src="js/ejercicio2.js"></script>
</body>
</html>
